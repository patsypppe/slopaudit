[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "slopaudit"
dynamic = ["version", "readme"]
description = "Verify AI-generated code: LLM-app security, hallucinated packages, stubs and spec drift."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "slopaudit contributors" }]
keywords = ["security", "static-analysis", "llm", "ai-generated-code", "sarif"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/patsypppe/slopaudit"
Repository = "https://github.com/patsypppe/slopaudit"
Issues = "https://github.com/patsypppe/slopaudit/issues"
Changelog = "https://github.com/patsypppe/slopaudit/blob/main/CHANGELOG.md"

[project.scripts]
slopaudit = "slopaudit.cli:app"

# PyPI shows the README without the repository around it, so relative links would break.
# Rewrite them to absolute GitHub URLs in the published description only.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/patsypppe/slopaudit/blob/main/\1)'

[tool.hatch.version]
path = "src/slopaudit/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "benchmarks", "examples", "README.md", "LICENSE", "CHANGELOG.md", "action.yml"]

[tool.hatch.build.targets.wheel]
packages = ["src/slopaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/slopaudit/cli.py" = ["B008"]

[tool.slopaudit.scan]
exclude = ["tests/**", "benchmarks/corpus/**", "examples/**"]
