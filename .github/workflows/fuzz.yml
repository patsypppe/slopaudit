name: fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,fuzz]"
      - name: Fuzz the scanner
        run: pytest -q -m fuzz
